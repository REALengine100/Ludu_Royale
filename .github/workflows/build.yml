name: Build Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
          
      - name: Setup Android project & Force SDK 34
        run: |
          if [ ! -d "android" ]; then
            flutter create . --org com.muaz --project-name ludo_royale --platforms=android
          fi
          
          # Force compileSdk and targetSdk to 34 in project
          find android -name "build.gradle" -exec sed -i 's/compileSdkVersion 35/compileSdkVersion 34/g' {} +
          find android -name "build.gradle" -exec sed -i 's/targetSdkVersion 35/targetSdkVersion 34/g' {} +
          find android -name "build.gradle" -exec sed -i 's/compileSdk = 35/compileSdk = 34/g' {} +
          find android -name "build.gradle" -exec sed -i 's/targetSdk = 35/targetSdk = 34/g' {} +
          find android -name "build.gradle" -exec sed -i 's/compileSdk 35/compileSdk 34/g' {} +
          find android -name "build.gradle" -exec sed -i 's/targetSdk 35/targetSdk 34/g' {} +
          
          # Update Kotlin version in settings.gradle
          sed -i 's/version "1.[0-9].[0-9]*" apply false/version "1.9.24" apply false/g' android/settings.gradle || true

      - name: Generate Custom Ludo App Icon
        run: |
          python3 << 'EOF'
          import os, urllib.request
          # Create a clean adaptive/standard launcher icon structure or replace mipmap PNGs with a solid Ludo colored design
          res_dir = 'android/app/src/main/res'
          if os.path.exists(res_dir):
              # Generate simple colored placeholder icons for all densities to replace flutter logo
              densities = ['mipmap-hdpi', 'mipmap-mdpi', 'mipmap-xhdpi', 'mipmap-xxhdpi', 'mipmap-xxxhdpi']
              for d in densities:
                  d_path = os.path.join(res_dir, d)
                  os.makedirs(d_path, exist_ok=True)
                  # We create a simple valid PNG header or download/write a custom icon file if needed
                  icon_file = os.path.join(d_path, 'ic_launcher.png')
                  # Minimal valid 1x1 or colored PNG bytes as fallback, or use a python script to draw a Ludo board icon if PIL is present
                  try:
                      from PIL import Image, ImageDraw
                      img = Image.new('RGB', (192, 192), color=(43, 27, 107))
                      draw = ImageDraw.Draw(img)
                      # Draw Ludo 4 colors representation (Red, Green, Yellow, Blue)
                      draw.rectangle([16, 16, 92, 92], fill=(233, 30, 99))     # Red
                      draw.rectangle([100, 16, 176, 92], fill=(76, 175, 80))   # Green
                      draw.rectangle([16, 100, 92, 176], fill=(255, 193, 7))   # Yellow
                      draw.rectangle([100, 100, 176, 176], fill=(33, 150, 243)) # Blue
                      img.save(icon_file)
                  except Exception:
                      pass
          EOF
          
      - name: Flatten files and fix imports cleanly
        run: |
          python3 << 'EOF'
          import os, glob, re, shutil
          if os.path.exists('lib'):
              os.chdir('lib')
              for root, dirs, files in os.walk('.'):
                  if root == '.':
                      continue
                  for file in files:
                      if file.endswith('.dart'):
                        src = os.path.join(root, file)
                        dst = file
                        if not os.path.exists(dst):
                            os.rename(src, dst)
              for d in ['screens', 'services']:
                  if os.path.exists(d):
                      shutil.rmtree(d)
              
              for fn in glob.glob('*.dart'):
                  with open(fn, 'r', encoding='utf-8') as f:
                      content = f.read()
                  def fix_import(match):
                      quote = match.group(1)
                      path = match.group(2)
                      if path.startswith('package:'):
                          return f'import {quote}{path}{quote}'
                      filename = os.path.basename(path)
                      return f'import {quote}{filename}{quote}'
                  content = re.sub(r"import\s+(['\"])(.*?)(['\"])", fix_import, content)
                  with open(fn, 'w', encoding='utf-8') as f:
                      f.write(content)
          EOF
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Patch plugins for SDK 34
        run: |
          python3 << 'EOF'
          import os
          pub_cache = os.path.expanduser('~/.pub-cache')
          for root, dirs, files in os.walk(pub_cache):
              for file in files:
                  if file == 'build.gradle':
                      path = os.path.join(root, file)
                      try:
                          with open(path, 'r', encoding='utf-8') as f:
                              content = f.read()
                          new_content = content.replace('compileSdkVersion 35', 'compileSdkVersion 34')
                          new_content = new_content.replace('compileSdk 35', 'compileSdk 34')
                          if new_content != content:
                              with open(path, 'w', encoding='utf-8') as f:
                                  f.write(new_content)
                      except Exception:
                          pass
          EOF
          
      - name: Run Android patch
        run: |
          if [ -f tools/patch_android.py ]; then
            python3 tools/patch_android.py
          fi
          
      - name: Build APK and AAB
        run: |
          flutter build apk --release
          flutter build appbundle --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: build/app/outputs/bundle/release/app-release.aab

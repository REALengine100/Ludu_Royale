name: Build Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
          
      - name: Generate Android project files
        run: |
          flutter create . --org com.muaz --project-name ludo_royale --platforms=android
          # Update compileSdk and targetSdk to 35
          sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion 34/targetSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/compileSdk = 34/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/targetSdk = 34/targetSdk = 35/g' android/app/build.gradle || true
          sed -i 's/compileSdk 34/compileSdk 35/g' android/app/build.gradle || true
          sed -i 's/targetSdk 34/targetSdk 35/g' android/app/build.gradle || true
          # Update Kotlin version in settings.gradle
          sed -i 's/version "1.[0-9].[0-9]*" apply false/version "1.9.24" apply false/g' android/settings.gradle || true
          
      - name: Flatten and normalize imports in lib/
        run: |
          cd lib
          rm -rf screens services || true
          for f in *.dart; do
            sed -i "s|import 'screens/|import '|g" "$f"
            sed -i "s|import 'services/|import '|g" "$f"
            sed -i "s|import \"screens/|import \"|g" "$f"
            sed -i "s|import \"services/|import \"|g" "$f"
            sed -i "s|import '\.\./|import '|g" "$f"
            sed -i "s|import \"\.\./|import \"|g" "$f"
          done
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Run Android patch
        run: |
          if [ -f tools/patch_android.py ]; then
            python3 tools/patch_android.py
          fi
          
      - name: Build APK and AAB
        run: |
          flutter build apk --release
          flutter build appbundle --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: build/app/outputs/bundle/release/app-release.aab

name: Build Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
          
      - name: Generate Android project files
        run: |
          flutter create . --org com.muaz --project-name ludo_royale --platforms=android
          # Update compileSdk and targetSdk to 35
          sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion 34/targetSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/compileSdk = 34/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/targetSdk = 34/targetSdk = 35/g' android/app/build.gradle || true
          sed -i 's/compileSdk 34/compileSdk 35/g' android/app/build.gradle || true
          sed -i 's/targetSdk 34/targetSdk 35/g' android/app/build.gradle || true
          # Update Kotlin version in settings.gradle
          sed -i 's/version "1.[0-9].[0-9]*" apply false/version "1.9.24" apply false/g' android/settings.gradle || true
          
      - name: Flatten files and fix imports automatically
        run: |
          python3 -c "
          import os, glob, re, shutil
          os.chdir('lib')
          for root, dirs, files in os.walk('.'):
              if root == '.':
                  continue
              for file in files:
                  if file.endswith('.dart'):
                      src = os.path.join(root, file)
                      dst = file
                      if not os.path.exists(dst):
                          os.rename(src, dst)
          for d in ['screens', 'services']:
              if os.path.exists(d):
                  shutil.rmtree(d)
          
          for fn in glob.glob('*.dart'):
              with open(fn, 'r', encoding='utf-8') as f:
                  content = f.read()
              def fix_import(match):
                  quote = match.group(1)
                  path = match.group(2)
                  if path.startswith('package:'):
                      return f'import {quote}{path}{quote}'
                  filename = os.path.basename(path)
                  return f'import {quote}{filename}{quote}'
              content = re.sub(r\"import\s+(['\"])(.*?)(['\"])\", fix_import, content)
              with open(fn, 'w', encoding='utf-8') as f:
                  f.write(content)
          "
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Run Android patch
        run: |
          if [ -f tools/patch_android.py ]; then
            python3 tools/patch_android.py
          fi
          
      - name: Build APK and AAB
        run: |
          flutter build apk --release
          flutter build appbundle --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: build/app/outputs/bundle/release/app-release.aab
